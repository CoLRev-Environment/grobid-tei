name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish distributions
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/grobid-tei
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test and build dependencies
        run: python -m pip install --upgrade pip build ".[test]"

      - name: Run tests
        run: python -m pytest

      - name: Build distributions
        run: python -m build

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
